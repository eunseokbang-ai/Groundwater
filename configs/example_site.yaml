# Site configuration for the discontinuity-extraction pipeline.
# Copy this file per site (e.g. configs/site_a.yaml) and edit the paths below.

site_name: example_site

paths:
  # RGB photogrammetry outputs (Pix4D / Metashape). LiDAR + thermal are added
  # in Phase 2 once acquired -- leave blank until then.
  point_cloud: data/raw/example_site/rgb_photogrammetry/pointcloud.las
  mesh: data/raw/example_site/rgb_photogrammetry/model.obj
  orthomosaic: data/raw/example_site/rgb_photogrammetry/orthomosaic.tif
  lidar_point_cloud: null
  thermal_orthomosaic: null
  # Field-measured joint orientations for validation (scanline / borehole).
  # CSV columns: id,dip,dip_direction,x,y,z (x,y,z optional)
  field_measurements: data/raw/example_site/field/scanline_joints.csv
  output_dir: data/processed/example_site

# Coordinate reference system of the inputs above (informational; all inputs
# must already share this CRS -- see registration module for Phase 2).
crs: EPSG:5186

preprocessing:
  # Voxel size (meters) used to downsample the point cloud before normal
  # estimation / orientation clustering. Should be well below the smallest
  # joint spacing you expect to resolve.
  voxel_size: 0.02
  # Optional axis-aligned bounding box crop [xmin, ymin, zmin, xmax, ymax, zmax]
  # to isolate the excavation face from surrounding terrain. Null = no crop.
  crop_bbox: null

normals:
  # Neighborhood radius (meters) for normal + planarity estimation. Should span
  # several point spacings but stay smaller than the joint faces you want to see.
  search_radius: 0.1
  max_nn: 30

orientation_sets:
  # Coplanarity filter: points whose local surface variation exceeds this are
  # ignored (vegetation, netting edges, plane intersections). Flat = 0, blob = 0.33.
  # Raise it if rough joint faces are being discarded.
  max_surface_variation: 0.1
  # Stereonet kernel density: grid resolution and smoothing bandwidth.
  grid_spacing_deg: 1.5
  bandwidth_deg: 6.0
  # Two sets closer than this are treated as one.
  min_separation_deg: 20.0
  # Poles further than this from every set mean stay unassigned.
  cone_angle_deg: 25.0
  # A set needs at least this fraction of planar points...
  min_set_fraction: 0.01
  # ...and a density peak this many times the median (background) density.
  min_peak_contrast: 3.0
  max_sets: null

patches:
  # Points closer than link_distance are always joined into one patch; points
  # more than ~3.5x link_distance apart never are. Keep it >= ~2x point spacing.
  # Parallel joints closer than ~3.5x this merge, and spacings below it are not
  # reported (drone resolution cannot resolve them anyway).
  link_distance: 0.05
  min_patch_points: 30

trace_mapping:
  canny_low: 50
  canny_high: 150
  hough_min_line_length_px: 20
  hough_max_line_gap_px: 5
