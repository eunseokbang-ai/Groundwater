[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "groundwater"
version = "0.1.0"
description = "Discontinuity (joint/fracture) extraction and groundwater seepage-pathway detection from drone RGB/LiDAR/thermal rock-face models"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
